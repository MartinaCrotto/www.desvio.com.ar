<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>mapa.deƨvío</title>

    <!-- Leaflet -->
    <link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"
/>

<link rel="stylesheet" href="style.css">

<link rel="icon" type="image/png" href="img/ologo.png">

</head>

<body>

    <!-- ==========================================
         BARRA LATERAL
    =========================================== -->

    <aside id="sidebar">

        <div class="logo">

            <img
                src="https://upload.wikimedia.org/wikipedia/commons/a/aa/Google_Maps_icon_%282020%29.svg"
                alt="Google Maps"
            >

        </div>

        <div class="logoDesvio">

            <img
                src="img/O.png"
                alt="Desvío"
            >

        </div>

    </aside>



    <!-- ==========================================
         BARRA SUPERIOR
    =========================================== -->

    <header id="topbar">

        <input
            type="text"
            placeholder="Buscar"
        >

        <button class="searchButton">

            <svg width="20" height="20" viewBox="0 0 24 24">

                <circle
                    cx="11"
                    cy="11"
                    r="7"
                    fill="none"
                    stroke="#555"
                    stroke-width="2"
                />

                <line
                    x1="16.5"
                    y1="16.5"
                    x2="21"
                    y2="21"
                    stroke="#555"
                    stroke-width="2"
                />

            </svg>

        </button>

    </header>



    <!-- ==========================================
         MAPA
    =========================================== -->

    <main id="map"></main>



    <!-- ==========================================
         PANEL GOOGLE MAPS
    =========================================== -->

    <section id="overlay">

    <button id="cerrarOverlay">✕</button>

    <h2 id="titulo"></h2>

<p id="fecha"></p>

<p id="direccion"></p>

<p id="barrio"></p>

<button id="comoLlegar">
    Cómo llegar
</button>

</section>

<div id="loadingRuta">

    Calculando desvío...

</div>

    <!-- ==========================================
         LIBRERÍAS
    =========================================== -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script src="script.js"></script>
</body>

</html>
